name: "Build and Deploy Godot Web"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export_web:
    runs-on: ubuntu-latest
    name: Export Web Job
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Godot Web Export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.6.1&flavor=stable&slug=linux.x86_64.zip&platform=linux.64
          godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.6.1&flavor=stable&slug=export_templates.tpz&platform=templates
          relative_project_path: ./
          archive_export_output: false
          # "web" MUST match your export preset name in Godot exactly
          export_preset_name: web 

      - name: Prepare Files for Pages
        run: |
          mkdir -p build/web
          # Moving the exported files from the default folder to our deploy folder
          if [ -d "exports/web" ]; then
            mv exports/web/* build/web/
          fi
          # Ensure an index.html exists for GitHub Pages
          if [ -f build/web/web.html ] && [ ! -f build/web/index.html ]; then
            mv build/web/web.html build/web/index.html
          fi

          # Add coi-serviceworker to handle Cross-Origin Isolation and SharedArrayBuffer for Godot 4 web exports
          curl -sL https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js > build/web/coi-serviceworker.min.js
          sed -i 's|</head>|<script src="coi-serviceworker.min.js"></script></head>|g' build/web/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

  deploy:
    needs: export_web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
